name: PhiOrbit adaptive rhythm study

on:
  pull_request:
    paths:
      - 'src/phiorbit-*.mjs'
      - 'tests/phiorbit-*.test.mjs'
      - '.github/workflows/phiorbit-adaptive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/phiorbit-adaptive.test.mjs
      - name: Run matched adaptive study
        run: |
          node --input-type=module -e "import {studyAdaptive,runAdaptive} from './src/phiorbit-adaptive.mjs'; import {fixtureDomains,fixtureJobs} from './src/phiorbit-nested.mjs'; console.log(JSON.stringify({...studyAdaptive(),execution:runAdaptive(fixtureDomains(),fixtureJobs(369,'mixed').slice(0,24))},null,2))" > phiorbit-o4.json
          node -e "const r=require('./phiorbit-o4.json'); console.log(JSON.stringify(r.rows))"
      - uses: actions/upload-artifact@v4
        with:
          name: phiorbit-o4-study
          path: phiorbit-o4.json
          if-no-files-found: error
