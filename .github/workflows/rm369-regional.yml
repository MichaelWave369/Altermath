name: RM369 regional storage study

on:
  pull_request:
    paths:
      - 'src/rm369-*.mjs'
      - 'tests/rm369-*.test.mjs'
      - 'scripts/rm369-regional-study.mjs'
      - '.github/workflows/rm369-regional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rm369-regional.test.mjs
      - name: Matched E5 plus regional study
        run: |
          node scripts/rm369-regional-study.mjs --timed > rm369-e6-measurements.json
          node -e "const r=require('./rm369-e6-measurements.json'); console.log(JSON.stringify(r.summary))"
      - uses: actions/upload-artifact@v4
        with:
          name: rm369-e6-measurements
          path: rm369-e6-measurements.json
          if-no-files-found: error
